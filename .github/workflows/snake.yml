name: Generate Contribution Snake

on:
  schedule:
    # Every day at 12:00 AM IST (18:30 UTC)
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Yuvraj1954
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#5EEAD4&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353&color_background=#0B1020

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
