<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Rule number one of programming</title>
  <desc id="desc">If it works, do not touch it, shown with a blinking cursor.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#121c35"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#5eead4" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="360" height="240" rx="14" fill="url(#bg)"/>
  <rect width="360" height="240" rx="14" fill="url(#grid)"/>
  <rect x="14" y="14" width="332" height="212" rx="10" fill="#08101f" fill-opacity=".72" stroke="#5eead4" stroke-opacity=".32"/>
  <circle cx="31" cy="32" r="4" fill="#ff8fb3"/><circle cx="45" cy="32" r="4" fill="#ffcb6b"/><circle cx="59" cy="32" r="4" fill="#5eead4"/>
  <text x="28" y="70" fill="#5eead4" font-family="monospace" font-size="11" letter-spacing="2">PROGRAMMING_RULES.MD</text>
  <path d="M28 87H332" stroke="#5eead4" stroke-opacity=".18"/>
  <text x="28" y="116" fill="#ffcb6b" font-family="monospace" font-size="18" font-weight="bold">RULE #1 OF</text>
  <text x="28" y="140" fill="#ffcb6b" font-family="monospace" font-size="18" font-weight="bold">PROGRAMMING</text>
  <path d="M28 157H122" stroke="#ffcb6b" stroke-width="2"/>
  <text x="28" y="187" fill="#e6edf7" font-family="monospace" font-size="15">If it works, don't touch it.</text>
  <rect x="292" y="173" width="9" height="18" fill="#5eead4" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;0;1" dur="1s" repeatCount="indefinite"/></rect>
  <text x="28" y="210" fill="#5eead4" fill-opacity=".7" font-family="monospace" font-size="10">// a stable system is a beautiful thing</text>
</svg>
