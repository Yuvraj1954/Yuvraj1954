<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 215" role="img" aria-labelledby="title desc">
 <title id="title">The build loop</title><desc id="desc">An animated developer process loop from idea to prototype to debugging to another idea.</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5z" fill="#5475a0"/></marker><filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <rect width="1100" height="215" rx="16" fill="#0b1020"/>
 <path id="route" d="M155 95H315H475H635H795 C940 95 950 180 795 180H155C43 180 40 95 155 95" fill="none" stroke="#263c5e" stroke-width="3" marker-end="url(#a)"/>
 <g font-family="monospace" text-anchor="middle"><g transform="translate(155 95)"><circle r="49" fill="#20374a" stroke="#5eead4" stroke-width="2"/><text y="-5" fill="#eafffb" font-size="14" font-weight="700">IDEA</text><text y="16" fill="#9ad8d0" font-size="11">seems easy</text></g><g transform="translate(315 95)"><circle r="49" fill="#26305a" stroke="#8fa8ff" stroke-width="2"/><text y="-5" fill="#f0f3ff" font-size="14" font-weight="700">BUILD</text><text y="16" fill="#b4c0f1" font-size="11">make a version</text></g><g transform="translate(475 95)"><circle r="49" fill="#4a2835" stroke="#ff8fb3" stroke-width="2"/><text y="-5" fill="#fff0f5" font-size="13" font-weight="700">WHAT?</text><text y="16" fill="#efb1c4" font-size="11">unexpected lore</text></g><g transform="translate(635 95)"><circle r="49" fill="#493b22" stroke="#ffcb6b" stroke-width="2"/><text y="-5" fill="#fff8e8" font-size="13" font-weight="700">DEBUG</text><text y="16" fill="#efd693" font-size="11">stare intensely</text></g><g transform="translate(795 95)"><circle r="49" fill="#20374a" stroke="#5eead4" stroke-width="2"/><text y="-5" fill="#eafffb" font-size="13" font-weight="700">AHA!</text><text y="16" fill="#9ad8d0" font-size="11">new possibility</text></g></g>
 <circle r="6" fill="#ffcb6b" filter="url(#g)"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle><text x="550" y="202" text-anchor="middle" fill="#6380a8" font-family="monospace" font-size="12">LOOP UNTIL IT WORKS · THEN ASK WHAT ELSE IT COULD DO</text>
</svg>
