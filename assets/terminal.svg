<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 446" width="850" height="446">
  <defs>
    <clipPath id="t1"><rect y="54" width="0" height="26"><animate attributeName="width" to="300" dur="0.85s" begin="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect y="114" width="0" height="26"><animate attributeName="width" to="320" dur="0.85s" begin="2.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect y="176" width="0" height="26"><animate attributeName="width" to="480" dur="1.25s" begin="3.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t7"><rect y="310" width="0" height="26"><animate attributeName="width" to="320" dur="0.85s" begin="6.0s" fill="freeze"/></rect></clipPath>
    <clipPath id="t9"><rect y="372" width="0" height="26"><animate attributeName="width" to="200" dur="0.65s" begin="7.5s" fill="freeze"/></rect></clipPath>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .o2  { opacity: 0; animation: fadeIn 0.15s ease forwards 1.65s; }
    .o4  { opacity: 0; animation: fadeIn 0.15s ease forwards 3.15s; }
    .s1  { opacity: 0; animation: fadeIn 0.15s ease forwards 5.05s; }
    .s2  { opacity: 0; animation: fadeIn 0.15s ease forwards 5.25s; }
    .s3  { opacity: 0; animation: fadeIn 0.15s ease forwards 5.45s; }
    .s4  { opacity: 0; animation: fadeIn 0.15s ease forwards 5.65s; }
    .o8  { opacity: 0; animation: fadeIn 0.15s ease forwards 7.15s; }
    .o10 { opacity: 0; animation: fadeIn 0.15s ease forwards 8.45s; }
    .cur { opacity: 0; animation: fadeIn 0.1s ease forwards 8.8s, blink 1s step-end infinite 8.8s; }
  </style>

  <!-- Terminal window -->
  <rect width="850" height="446" rx="12" fill="#0d1117"/>

  <!-- Title bar -->
  <rect width="850" height="38" rx="12" fill="url(#tg)"/>
  <rect width="850" height="20" y="18" fill="url(#tg)"/>
  <circle cx="24" cy="19" r="6.5" fill="#ff5f57"/>
  <circle cx="46" cy="19" r="6.5" fill="#febc2e"/>
  <circle cx="68" cy="19" r="6.5" fill="#28c840"/>
  <text x="425" y="24" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="13">suat@macbook — zsh</text>

  <!-- CMD 1: typewriter -->
  <g clip-path="url(#t1)">
    <text y="72" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#7ee787" font-weight="bold">$</tspan>
      <tspan fill="#79c0ff"> whoami</tspan>
      <tspan fill="#ff7b72"> &amp;&amp; </tspan>
      <tspan fill="#79c0ff">hostname</tspan>
    </text>
  </g>

  <!-- OUT 1: fadeIn -->
  <g class="o2">
    <text x="24" y="98" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">suat kocar · manchester, uk</text>
  </g>

  <!-- CMD 2: typewriter -->
  <g clip-path="url(#t3)">
    <text y="132" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#7ee787" font-weight="bold">$</tspan>
      <tspan fill="#79c0ff"> cat</tspan>
      <tspan fill="#e6edf3"> ~/.career</tspan>
      <tspan fill="#ff7b72"> | </tspan>
      <tspan fill="#79c0ff">tail</tspan>
      <tspan fill="#ffa657"> -1</tspan>
    </text>
  </g>

  <!-- OUT 2: fadeIn -->
  <g class="o4">
    <text x="24" y="158" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan fill="#8b949e">lawyer</tspan>
      <tspan fill="#484f58"> → </tspan>
      <tspan fill="#8b949e">cs masters</tspan>
      <tspan fill="#484f58"> → </tspan>
      <tspan fill="#c9d1d9">software engineer</tspan>
      <tspan fill="#484f58"> → </tspan>
      <tspan fill="#e6edf3" font-weight="bold">cto</tspan>
    </text>
  </g>

  <!-- CMD 3: typewriter -->
  <g clip-path="url(#t5)">
    <text y="194" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#7ee787" font-weight="bold">$</tspan>
      <tspan fill="#79c0ff"> printenv</tspan>
      <tspan fill="#e6edf3"> STACK</tspan>
      <tspan fill="#ff7b72"> | </tspan>
      <tspan fill="#79c0ff">xargs</tspan>
      <tspan fill="#ffa657"> -n5</tspan>
      <tspan fill="#ff7b72"> | </tspan>
      <tspan fill="#79c0ff">column</tspan>
      <tspan fill="#ffa657"> -t</tspan>
    </text>
  </g>

  <!-- STACK output rows: fadeIn cascade -->
  <g class="s1">
    <text y="220" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#e6edf3">typescript</tspan>
      <tspan x="170" fill="#e6edf3">rust</tspan>
      <tspan x="290" fill="#e6edf3">swift</tspan>
      <tspan x="420" fill="#e6edf3">java</tspan>
      <tspan x="550" fill="#e6edf3">c#</tspan>
    </text>
  </g>

  <g class="s2">
    <text y="244" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#e6edf3">sveltekit</tspan>
      <tspan x="170" fill="#e6edf3">react</tspan>
      <tspan x="290" fill="#e6edf3">next.js</tspan>
      <tspan x="420" fill="#e6edf3">swiftui</tspan>
      <tspan x="550" fill="#e6edf3">tailwind</tspan>
    </text>
  </g>

  <g class="s3">
    <text y="268" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#e6edf3">node</tspan>
      <tspan x="170" fill="#e6edf3">graphql</tspan>
      <tspan x="290" fill="#e6edf3">mongodb</tspan>
      <tspan x="420" fill="#e6edf3">redis</tspan>
      <tspan x="550" fill="#e6edf3">python</tspan>
    </text>
  </g>

  <g class="s4">
    <text y="292" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#e6edf3">docker</tspan>
      <tspan x="170" fill="#e6edf3">k8s</tspan>
      <tspan x="290" fill="#e6edf3">azure</tspan>
      <tspan x="420" fill="#e6edf3">aws</tspan>
      <tspan x="550" fill="#e6edf3">circleci</tspan>
    </text>
  </g>

  <!-- CMD 4: typewriter -->
  <g clip-path="url(#t7)">
    <text y="328" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#7ee787" font-weight="bold">$</tspan>
      <tspan fill="#79c0ff"> uptime</tspan>
      <tspan fill="#ffa657"> -s</tspan>
      <tspan fill="#ff7b72"> &amp;&amp; </tspan>
      <tspan fill="#79c0ff">uptime</tspan>
      <tspan fill="#ffa657"> -p</tspan>
    </text>
  </g>

  <!-- OUT 4: fadeIn -->
  <g class="o8">
    <text x="24" y="354" fill="#e6edf3" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">2019-02-24 · up 7 years · still shipping</text>
  </g>

  <!-- CMD 5: typewriter -->
  <g clip-path="url(#t9)">
    <text y="390" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">
      <tspan x="24" fill="#7ee787" font-weight="bold">$</tspan>
      <tspan fill="#79c0ff"> fortune</tspan>
      <tspan fill="#ffa657"> -s</tspan>
    </text>
  </g>

  <!-- OUT 5: fadeIn -->
  <g class="o10">
    <text x="24" y="416" fill="#a5d6ff" font-family="ui-monospace, 'SF Mono', 'Fira Code', monospace" font-size="15">"i'd rather debug software than debug legal arguments"</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cur" x="24" y="430" width="9" height="2" fill="#7ee787"/>
</svg>
