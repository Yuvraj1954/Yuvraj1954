<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Developer loadout</title>
  <desc id="desc">A futuristic developer loadout HUD featuring visual icons for languages, build tools, and data technologies.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101a30"/><stop offset="1" stop-color="#090d1d"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#263858" stroke-width=".6" opacity=".6"/></pattern>
  </defs>
  <rect width="1100" height="520" rx="18" fill="url(#bg)"/><rect width="1100" height="520" rx="18" fill="url(#grid)"/>
  <path d="M38 78h1024M38 448h1024" stroke="#405e88"/><path d="M38 78h175" stroke="#5eead4" stroke-width="3"/>
  <g font-family="monospace"><text x="40" y="48" font-size="22" font-weight="700" letter-spacing="2" fill="#f1f6ff">DEVELOPER LOADOUT</text><text x="40" y="67" font-size="11" fill="#8ea7ca">EQUIPPED MODULES // BUILT WITH, NOT JUST COLLECTED</text><text x="954" y="48" font-size="12" fill="#5eead4">◉ ONLINE</text></g>
  <g font-family="monospace" font-size="13" font-weight="700"><text x="40" y="110" fill="#5eead4">01 / LANGUAGES</text><text x="40" y="231" fill="#ffcb6b">02 / BUILD DECK</text><text x="40" y="352" fill="#ab7cff">03 / DATA BAY</text></g>
