<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Developer loadout</title>
  <desc id="desc">A futuristic developer loadout HUD using official technology icons for languages, build tools, and data technologies.</desc>
  <!-- Official technology marks are stored locally in assets/icons from Simple Icons. -->
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101a30"/><stop offset="1" stop-color="#090d1d"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#263858" stroke-width=".6" opacity=".6"/></pattern>
    <g id="card"><rect width="145" height="88" rx="9" fill="#112039" stroke="#496b96" stroke-width="1.5"/></g>
    <g id="data-card"><rect width="145" height="88" rx="9" fill="#201a35" stroke="#79609f" stroke-width="1.5"/></g>
  </defs>
  <rect width="1100" height="520" rx="18" fill="url(#bg)"/><rect width="1100" height="520" rx="18" fill="url(#grid)"/>
  <path d="M38 78h1024M38 448h1024" stroke="#405e88"/><path d="M38 78h175" stroke="#5eead4" stroke-width="3"/>
  <g font-family="monospace"><text x="40" y="48" font-size="22" font-weight="700" letter-spacing="2" fill="#f1f6ff">DEVELOPER LOADOUT</text><text x="40" y="67" font-size="11" fill="#8ea7ca">EQUIPPED MODULES // BUILT WITH, NOT JUST COLLECTED</text><text x="954" y="48" font-size="12" fill="#5eead4">◉ ONLINE</text></g>
  <g font-family="monospace" font-size="13" font-weight="700"><text x="40" y="110" fill="#5eead4">01 / LANGUAGES</text><text x="40" y="231" fill="#ffcb6b">02 / BUILD DECK</text><text x="40" y="352" fill="#ab7cff">03 / DATA BAY</text></g>
  <!-- Languages: official local marks -->
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#eaf3ff" font-size="14">
    <use href="#card" x="190" y="92"/><image href="icons/python.svg" x="246" y="106" width="32" height="32"/><text x="262" y="168">PYTHON</text>
    <use href="#card" x="348" y="92"/><image href="icons/c.svg" x="404" y="106" width="32" height="32"/><text x="420" y="168">C</text>
    <use href="#card" x="506" y="92"/><image href="icons/cplusplus.svg" x="562" y="106" width="32" height="32"/><text x="578" y="168">C++</text>
    <use href="#card" x="664" y="92"/><image href="icons/dart.svg" x="720" y="106" width="32" height="32"/><text x="736" y="168">DART</text>
    <use href="#card" x="822" y="92"/><ellipse cx="894" cy="119" rx="22" ry="8" fill="#7295b8"/><path d="M872 119v26c0 11 44 11 44 0v-26" fill="#4f7194"/><ellipse cx="894" cy="145" rx="22" ry="8" fill="#4f7194"/><text x="894" y="168">SQL</text>
    <!-- Build: official local marks -->
    <use href="#card" x="190" y="213"/><image href="icons/flutter.svg" x="246" y="227" width="32" height="32"/><text x="262" y="289">FLUTTER</text>
    <use href="#card" x="348" y="213"/><image href="icons/fastapi.svg" x="404" y="227" width="32" height="32"/><text x="420" y="289">FASTAPI</text>
    <use href="#card" x="506" y="213"/><image href="icons/html5.svg" x="562" y="227" width="32" height="32"/><text x="578" y="289">HTML5</text>
    <use href="#card" x="664" y="213"/><image href="icons/css.svg" x="720" y="227" width="32" height="32"/><text x="736" y="289">CSS</text>
    <use href="#card" x="822" y="213"/><image href="icons/javascript.svg" x="878" y="227" width="32" height="32"/><text x="894" y="289">JAVASCRIPT</text>
    <!-- Data: official local marks -->
    <use href="#data-card" x="427" y="334"/><image href="icons/postgresql.svg" x="483" y="348" width="32" height="32"/><text x="499" y="410">POSTGRESQL</text>
    <use href="#data-card" x="585" y="334"/><image href="icons/supabase.svg" x="641" y="348" width="32" height="32"/><text x="657" y="410">SUPABASE</text>
  </g>
  <g font-family="monospace" font-size="12"><text x="40" y="485" fill="#a5b8d6">CODE</text><rect x="93" y="475" width="145" height="10" rx="5" fill="#5eead4"/><text x="252" y="485" fill="#5eead4">ONLINE</text><text x="420" y="485" fill="#a5b8d6">IDEAS</text><rect x="480" y="475" width="145" height="10" rx="5" fill="#ffcb6b"/><text x="639" y="485" fill="#ffcb6b">OVERFLOW</text><text x="815" y="485" fill="#a5b8d6">BUGS</text><rect x="866" y="475" width="76" height="10" rx="5" fill="#ab7cff"/><rect x="948" y="475" width="55" height="10" rx="5" fill="#263858"/><text x="1015" y="485" fill="#ab7cff">CONTAINED*</text></g>
</svg>
