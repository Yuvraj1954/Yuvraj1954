<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Orbiting Debug Station map</title><desc id="desc">A glowing pseudo three dimensional station with orbiting coder interests.</desc>
  <defs><radialGradient id="space"><stop stop-color="#182344"/><stop offset="1" stop-color="#090d1c"/></radialGradient><filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1200" height="430" rx="18" fill="url(#space)"/>
  <g fill="#a6c9ff" opacity=".8"><circle cx="87" cy="60" r="1"/><circle cx="170" cy="343" r="1.5"/><circle cx="1022" cy="52" r="1"/><circle cx="1121" cy="326" r="1.4"/><circle cx="891" cy="382" r="1"/></g>
  <g fill="none" stroke="#334b77"><ellipse cx="600" cy="217" rx="430" ry="140"/><ellipse cx="600" cy="217" rx="305" ry="98" stroke-dasharray="5 8"/></g>
  <g transform="translate(500 115)"><path d="M100 0 205 58v116L100 232 0 174V58z" fill="#152946" stroke="#75baff" stroke-width="2"/><path d="m0 58 100 58 105-58M100 116v116" fill="none" stroke="#75baff"/><path d="m26 72 74 41 77-41" fill="none" stroke="#ffcb6b" stroke-width="2"/><circle cx="100" cy="113" r="26" fill="#0b1429" stroke="#5eead4" stroke-width="2" filter="url(#g)"/><text x="100" y="108" text-anchor="middle" fill="#eaf5ff" font-family="monospace" font-weight="700" font-size="13">DEBUG</text><text x="100" y="125" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="11">STATION</text></g>
  <g font-family="monospace" text-anchor="middle"><g transform="translate(206 105)"><circle r="47" fill="#23234b" stroke="#ab7cff" stroke-width="2"/><text y="-4" fill="#f1edff" font-size="15" font-weight="700">AI + DATA</text><text y="16" fill="#b9abd9" font-size="11">patterns in the noise</text></g><g transform="translate(994 105)"><rect x="-57" y="-39" width="114" height="78" rx="12" fill="#17333e" stroke="#5eead4" stroke-width="2"/><text y="-4" fill="#e7fffb" font-size="15" font-weight="700">SYSTEMS</text><text y="16" fill="#9bd8d0" font-size="11">make it keep going</text></g><g transform="translate(220 327)"><path d="M0-50 48 0 0 50-48 0z" fill="#3b2539" stroke="#ff8fb3" stroke-width="2"/><text y="-4" fill="#fff0f5" font-size="15" font-weight="700">GAMES</text><text y="16" fill="#e8adbf" font-size="11">rules, loops, escape</text></g><g transform="translate(980 327)"><path d="M-59-33h118v66h-118z" fill="#40351b" stroke="#ffcb6b" stroke-width="2"/><text y="-4" fill="#fff8e8" font-size="14" font-weight="700">EXPERIMENTS</text><text y="16" fill="#ecd39a" font-size="11">probably useful later</text></g></g>
  <g fill="#5eead4" filter="url(#g)"><circle r="5"><animateMotion dur="8s" repeatCount="indefinite" path="M170 217a430 140 0 1 1 860 0a430 140 0 1 1-860 0"/></circle></g>
  <text x="600" y="406" text-anchor="middle" fill="#7390b8" font-family="monospace" font-size="13">EVERY ORBIT STARTED AS “I WONDER IF I CAN BUILD THAT”</text>
</svg>
