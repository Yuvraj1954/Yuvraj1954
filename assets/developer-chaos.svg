<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-labelledby="title desc">
  <title id="title">Developer chaos loop</title>
  <desc id="desc">A developer changes one thing, breaks the build, undoes the change, and smiles.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172342"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="360" height="240" rx="14" fill="url(#bg)"/>
  <rect x="14" y="14" width="332" height="212" rx="10" fill="#08101f" stroke="#5eead4" stroke-opacity=".28"/>
  <text x="28" y="38" fill="#5eead4" font-family="monospace" font-size="11" letter-spacing="1.5">DEVELOPER_CHAOS.EXE</text>
  <g transform="translate(190 57)">
    <rect width="126" height="78" rx="5" fill="#0d1830" stroke="#5eead4" stroke-opacity=".55"/>
    <rect x="8" y="9" width="66" height="4" rx="2" fill="#5eead4" opacity=".8"/><rect x="8" y="20" width="101" height="3" rx="1.5" fill="#8190ad" opacity=".45"/>
    <rect x="8" y="30" width="83" height="3" rx="1.5" fill="#8190ad" opacity=".45"/>
    <text x="8" y="55" fill="#5eead4" font-family="monospace" font-size="9">✓ ALL GREEN</text>
    <text x="8" y="55" fill="#ff6f91" font-family="monospace" font-size="9" opacity="0">✕ BUILD FAILED<animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;.31;.38;.42;.66;.72;1" dur="4.5s" repeatCount="indefinite"/></text>
  </g>
  <rect x="213" y="140" width="80" height="7" rx="3" fill="#5eead4" opacity=".7"/><path d="M253 135v5m-18 7v11m36-11v11" stroke="#8190ad" stroke-width="3"/>
  <g transform="translate(52 77)">
    <circle cx="48" cy="37" r="25" fill="#ffcb6b"/>
    <path d="M27 30q21-22 42 0v-9q-21-16-42 0z" fill="#5b3b35"/>
    <circle cx="39" cy="39" r="3" fill="#0b1020"/><circle cx="57" cy="39" r="3" fill="#0b1020"/>
    <path d="M38 52q10 8 20 0" fill="none" stroke="#0b1020" stroke-width="3" stroke-linecap="round"><animate attributeName="d" values="M38 52q10 8 20 0;M38 56q10-8 20 0;M38 56q10-8 20 0;M38 56q10-8 20 0;M38 52q10 8 20 0" keyTimes="0;.38;.66;.72;1" dur="4.5s" repeatCount="indefinite"/></path>
    <path d="M22 78q26-22 52 0v42H22z" fill="#6576a1"/><path d="M21 83L2 105M75 83l20 22" stroke="#ffcb6b" stroke-width="11" stroke-linecap="round"><animate attributeName="d" values="M21 83L2 105M75 83l20 22;M21 83L2 105M75 83l20 22;M21 83L-3 93M75 83l24 93;M21 83L-3 93M75 83l24 93;M21 83L2 105M75 83l20 22" keyTimes="0;.31;.42;.66;.72;1" dur="4.5s" repeatCount="indefinite"/></path>
  </g>
  <g font-family="monospace" font-size="10" font-weight="bold">
    <text x="29" y="55" fill="#5eead4" opacity="0">EVERYTHING WORKS ✓<animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.2;.25;1;1;1;1" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="29" y="55" fill="#ffcb6b" opacity="0">"ONE TINY CHANGE..."<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.2;.26;.38;.42;1;1" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="29" y="55" fill="#ff6f91" opacity="0">OH NO. OH NO.<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.38;.42;.45;.48;.66;.72" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="29" y="55" fill="#5eead4" opacity="0">CTRL+Z. WE'RE BACK.<animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;.66;.68;.7;.72;.76;1" dur="4.5s" repeatCount="indefinite"/></text>
  </g>
  <text x="28" y="211" fill="#8190ad" font-family="monospace" font-size="10">4.5s loop · lesson retained</text>
</svg>
