<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" role="img" aria-label="Signal chain: input, noise, filter, build, signal, feedback loop">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a4956"/>
    </marker>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="230" fill="none"/>

  <!-- main chain path (for the traveling pulse) -->
  <path id="chain" d="M100,90 L280,90 L460,90 L640,90 L820,90" fill="none" stroke="none"/>

  <!-- connecting lines -->
  <g stroke="#233240" stroke-width="2">
    <line x1="170" y1="90" x2="222" y2="90" marker-end="url(#arrow)"/>
    <line x1="350" y1="90" x2="402" y2="90" marker-end="url(#arrow)"/>
    <line x1="530" y1="90" x2="582" y2="90" marker-end="url(#arrow)"/>
    <line x1="710" y1="90" x2="762" y2="90" marker-end="url(#arrow)"/>
  </g>

  <!-- feedback loop, dashed, curls back underneath -->
  <path d="M820,110 C 820,190 100,190 100,110" fill="none" stroke="#3a2f1f" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="450" y="208" font-family="Consolas, Menlo, monospace" font-size="12" fill="#8a6a3a" text-anchor="middle">FEEDBACK — every signal loops back into the next INPUT</text>

  <!-- nodes -->
  <g font-family="Consolas, Menlo, monospace" font-size="13.5" font-weight="700" text-anchor="middle">
    <g>
      <rect x="35" y="65" width="130" height="50" rx="10" fill="#0c1016" stroke="#4dd8ff" stroke-width="1.6"/>
      <text x="100" y="95" fill="#4dd8ff">INPUT</text>
      <text x="100" y="132" font-size="10.5" font-weight="400" fill="#6e7681">a real problem</text>
    </g>
    <g>
      <rect x="215" y="65" width="130" height="50" rx="10" fill="#0c1016" stroke="#3a4552" stroke-width="1.6"/>
      <text x="280" y="95" fill="#c9d1d9">NOISE</text>
      <text x="280" y="132" font-size="10.5" font-weight="400" fill="#6e7681">assumptions, unknowns</text>
    </g>
    <g>
      <rect x="395" y="65" width="130" height="50" rx="10" fill="#0c1016" stroke="#3a4552" stroke-width="1.6"/>
      <text x="460" y="95" fill="#c9d1d9">FILTER</text>
      <text x="460" y="132" font-size="10.5" font-weight="400" fill="#6e7681">read, break it down</text>
    </g>
    <g>
      <rect x="575" y="65" width="130" height="50" rx="10" fill="#0c1016" stroke="#3a4552" stroke-width="1.6"/>
      <text x="640" y="95" fill="#c9d1d9">BUILD</text>
      <text x="640" y="132" font-size="10.5" font-weight="400" fill="#6e7681">ship, break, rebuild</text>
    </g>
    <g>
      <rect x="755" y="65" width="130" height="50" rx="10" fill="#0c1016" stroke="#ffb454" stroke-width="1.6"/>
      <text x="820" y="95" fill="#ffb454">SIGNAL</text>
      <text x="820" y="132" font-size="10.5" font-weight="400" fill="#6e7681">a working system</text>
    </g>
  </g>

  <!-- traveling pulse along the chain, loops forever -->
  <circle r="5" fill="#4dd8ff" filter="url(#nodeGlow)">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#chain"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
