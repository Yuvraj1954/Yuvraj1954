<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" width="260" role="img" aria-label="Yuvraj orbit station signature">
  <defs>
    <filter id="sigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sweep">
      <rect x="0" y="0" width="0" height="150">
        <animate attributeName="width" begin="0.4s" dur="1.1s" from="0" to="420" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Y monogram, drawn once as a trace -->
  <path d="M40,20 L75,65 L110,20 M75,65 L75,115" fill="none" stroke="#4dd8ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#sigGlow)" stroke-dasharray="220" stroke-dashoffset="220">
    <animate attributeName="stroke-dashoffset" begin="0.1s" dur="0.9s" from="220" to="0" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </path>

  <g clip-path="url(#sweep)">
    <text x="150" y="55" font-family="Consolas, Menlo, monospace" font-weight="700" font-size="30" fill="#e6edf3" letter-spacing="1">YUVRAJ</text>
    <text x="150" y="80" font-family="Consolas, Menlo, monospace" font-size="14" fill="#8b949e">1954</text>
    <text x="150" y="105" font-family="Consolas, Menlo, monospace" font-size="11" fill="#ffb454">// orbit station: online</text>
  </g>

  <!-- underline tick, like a scope grid mark -->
  <line x1="150" y1="112" x2="390" y2="112" stroke="#233240" stroke-width="1" opacity="0">
    <animate attributeName="opacity" begin="1.4s" dur="0.5s" to="0.8" fill="freeze"/>
  </line>
</svg>
